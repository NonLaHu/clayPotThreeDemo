<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-demo</title>
    <link rel="stylesheet" href="/src/style.css" />
    <script src="https://unpkg.com/feather-icons"></script>
  </head>
  <body>
    <div id="loading-screen">
      <div class="loading-content">
        <div class="loader"></div>
        <h2>Loading Pottery Studio...</h2>
        <p id="loading-status">Initializing...</p>
      </div>
    </div>
    

    <div id="app"></div>



    <!-- Transition Overlay -->
    <div id="transition-overlay"></div>
    
    
    
    <!-- Sunflower Color Selector (Painting Room) -->
    <div id="color-selector">
      <div class="sunflower-wheel">
        <div class="sunflower-center"></div>
        <!-- Petals will be added dynamically -->
      </div>
    </div>

    <div id="pattern-panel">
      <div class="pattern-panel-header">
        <h2>METAPHOR &amp; METER PALETTE</h2>
        <p>Choose your poetic pattern</p>
      </div>

      <div class="pattern-sections">
        <div
          class="pattern-section expanded"
          data-section="imagery"
        >
          <div class="pattern-section-header">
            <span>Patterns</span>

            <i
              class="chevron-icon"
              data-feather="chevron-down"
            ></i>
          </div>

          <div class="pattern-section-content">
            <div
              id="pattern-grid"
              class="pattern-grid"
            ></div>
          </div>
        </div>
      </div>

      <button
        class="see-all-btn"
        type="button"
      >
        See All
      </button>
    </div>
    
    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
